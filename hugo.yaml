baseURL: "https://rishavdahal.com.np/"
title: "Rishav Dahal"
theme: PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    locale: en-US
    label: English
    weight: 1

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

sitemap:
  changefreq: weekly
  priority: 0.7
  filename: sitemap.xml

services:
  googleAnalytics:
    id: "G-GLDKJ0K8EV"

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  giscus:
    repo: rishav-dahal/Portfolio-2.0
    repo_id: R_kgDONn0wnA
    category: General
    category_id: DIC_kwDONn0wnM4C3WQS
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: top
    theme: preferred_color_scheme
    lang: en
    loading: lazy

  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    theme_color: "#0057b8"
    msapplication_TileColor: "#0057b8"
    disableFingerprinting: false

  env: production
  title: "Rishav Dahal"
  description: "Portfolio, engineering blogs, and research by Rishav Dahal — CTO at DLPlatforms and Backend & DevOps Engineer specializing in scalable cloud systems, high-availability APIs, and distributed architectures."
  keywords: [Portfolio, Rishav Dahal, CTO, DLPlatforms, DLSurf, FitHisaab, Automyc, Backend Engineer, DevOps, Python, Django, FastAPI, Go, Docker, CI/CD, ICICSET, NCIT]
  author: "Rishav Dahal"
  images: ["images/default-og-image.jpg"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  label:
    text: "Rishav"
    icon: "images/logo.png"
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true
    title: "Hi, I'm Rishav Dahal <span class=\"wave-emoji\">👋</span>"
    subtitle: "CTO at DLPlatforms • Backend & DevOps Engineer • Research Author (ICICSET 2025). Building high-availability APIs, scalable cloud automation, and distributed systems."
    imageUrl: "images/profile.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "CTO & Backend / DevOps Engineer"
    buttons:
      - name: Blogs
        url: blogs
      - name: Projects
        url: projects
      - name: Cast in Nepal
        url: /cast-in-Nepal/
      - name: Search
        url: search
      - name: Contact
        url: contact

  # home-info mode
  homeInfoParams:
    Title: "👋 Welcome to Rishav's Portfolio"
    Content: "Explore my backend systems, cloud architectures, research writeups, and practical software engineering guides."

  socialIcons:
    - name: email
      url: "mailto:workwithrisaav@gmail.com"
    - name: github
      url: "https://github.com/rishav-dahal"
    - name: linkedin
      url: "https://www.linkedin.com/in/risaavdahal/"
    - name: medium
      url: "https://risaav.medium.com/"
    - name: dlsurf
      url: "https://rishav.dl.surf/"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: ""
    Text: ""
    appendFilePath: true

  # for client-side search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: blog
      name: Blogs
      url: blogs/
      weight: 1
    - identifier: projects
      name: Projects
      url: projects/
      weight: 2
    - identifier: cast-in-nepal
      name: Cast in Nepal
      url: /cast-in-Nepal/
      weight: 3
    - identifier: search
      name: Search
      url: search/
      weight: 4
    - identifier: about
      name: About
      url: about/
      weight: 5
    - identifier: contact
      name: Contact
      url: contact/
      weight: 6
